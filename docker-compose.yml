version: '3'
services:
  react-app-compteur:
    image: app-client
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
  

# jenkins server

  jenkins:
    image: jenkins/jenkins:lts
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home

  sonarqube:
    image: sonarqube:lts-community
    ports:
      - "9000:9000"
    environment:
      - SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true
    volumes:
      - sonarqube_data:/opt/sonarqube/data

volumes:
  jenkins_home:
  sonarqube_data: